[project]
name = "trailguard"
version = "0.1.0"
description = "Agents that remember the attacker: multi-agent account-takeover detection on Meko shared context."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "mcp>=1.9",
  "httpx>=0.27",
  "anthropic>=0.60",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
]

[project.scripts]
trailguard = "trailguard.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trailguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
